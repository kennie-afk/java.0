# Brings up identity-service, sync-service, core-service and the Postgres they share from nothing — a genuinely
# fresh volume, no manual role/password step. See services/identity-service/README
# for the two-role model this depends on, and AppRoleLoginBootstrap for how
# mara_app gets a login without a credential ever living in a migration.
#
#   cp .env.example .env     # then fill in the four secrets (none has a default)
#   docker compose up --build
#   python3 scripts/demo_seed.py   # creates a demo shop and prints a terminal enrolment code

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mara_identity
      POSTGRES_USER: mara_owner
      POSTGRES_PASSWORD: ${MARA_DB_OWNER_PASSWORD:?set in .env}
    volumes:
      - mara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mara_owner -d mara_identity"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${MARA_POSTGRES_PORT:-5433}:5432" # non-default host port: avoids colliding with another local Postgres

  # Shared rate-limit counters, so N replicas enforce one limit. Optional: without MARA_REDIS_URL each
  # replica limits on its own, and if Redis goes down the services fall back to that (they neither
  # open up nor refuse the tills). Holds nothing durable: no volume on purpose.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MARA_DB_URL: jdbc:postgresql://postgres:5432/mara_identity
      MARA_DB_OWNER_USER: mara_owner
      MARA_DB_OWNER_PASSWORD: ${MARA_DB_OWNER_PASSWORD:?set in .env}
      MARA_DB_APP_USER: mara_app
      MARA_DB_APP_PASSWORD: ${MARA_DB_APP_PASSWORD:?set in .env}
      # Credentials the deployer minted (scripts/new-credential.py --env). The two service
      # credentials are required, one per service and never shared; the bootstrap one is optional
      # (24 h, can only create the first platform operator); remove it when done. *_PREVIOUS keeps a
      # rotated-out credential alive for the overlap. Identity stores hashes only.
      MARA_SVC_SYNC_CREDENTIAL: ${MARA_SVC_SYNC_CREDENTIAL:?set in .env (scripts/new-credential.py --env)}
      MARA_SVC_SYNC_CREDENTIAL_PREVIOUS: ${MARA_SVC_SYNC_CREDENTIAL_PREVIOUS:-}
      MARA_SVC_CORE_CREDENTIAL: ${MARA_SVC_CORE_CREDENTIAL:?set in .env (scripts/new-credential.py --env)}
      MARA_SVC_CORE_CREDENTIAL_PREVIOUS: ${MARA_SVC_CORE_CREDENTIAL_PREVIOUS:-}
      MARA_BOOTSTRAP_CREDENTIAL: ${MARA_BOOTSTRAP_CREDENTIAL:-}
      MARA_REDIS_URL: redis://redis:6379
      MARA_RATELIMIT_ENROLMENT_PER_MINUTE: ${MARA_RATELIMIT_ENROLMENT_PER_MINUTE:-20}
      MARA_RATELIMIT_SIGNIN_PER_MINUTE: ${MARA_RATELIMIT_SIGNIN_PER_MINUTE:-120}
    ports:
      - "${MARA_IDENTITY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Terminal fan-in: verifies every uploaded journal entry (body digest, chain, Ed25519
  # signature) and keeps the server's append-only second copy. Own database, same Postgres
  # server; the service creates it on first start.
  sync-service:
    build:
      context: .
      dockerfile: services/sync-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment: &service-env
      MARA_SERVICE_CREDENTIAL: ${MARA_SVC_SYNC_CREDENTIAL:?set in .env (scripts/new-credential.py --env)}
      MARA_DB_OWNER_USER: mara_owner
      MARA_DB_OWNER_PASSWORD: ${MARA_DB_OWNER_PASSWORD:?set in .env}
      MARA_DB_APP_USER: mara_app
      MARA_DB_APP_PASSWORD: ${MARA_DB_APP_PASSWORD:?set in .env}
      MARA_IDENTITY_URL: http://identity-service:8081
      MARA_REDIS_URL: redis://redis:6379
      MARA_RATELIMIT_TERMINAL_PER_MINUTE: ${MARA_RATELIMIT_TERMINAL_PER_MINUTE:-1200}
      MARA_DB_URL: jdbc:postgresql://postgres:5432/mara_sync
    ports:
      - "${MARA_SYNC_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The transactional core: double-entry ledger, fiscal number leases, ingested sales. Pulls
  # verified entries from sync-service, so a till's upload never waits on it.
  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    environment:
      <<: *service-env
      MARA_SERVICE_CREDENTIAL: ${MARA_SVC_CORE_CREDENTIAL:?set in .env (scripts/new-credential.py --env)}
      MARA_DB_URL: jdbc:postgresql://postgres:5432/mara_core
      MARA_SYNC_URL: http://sync-service:8082
      MARA_FISCAL_LEASE_SIZE: ${MARA_FISCAL_LEASE_SIZE:-5000}
    ports:
      - "${MARA_CORE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The till. Serves the browser app and a same-origin proxy to identity-service's
  # enrolment endpoint. Deliberately no depends_on: a terminal must start, and sell,
  # with identity-service down. It only needs it once, to enrol.
  terminal:
    build:
      context: ./apps/terminal
    environment:
      IDENTITY_BASE_URL: http://identity-service:8081
      # Where the till uploads its journal and asks for fiscal numbers. Neither is needed to
      # sell: with both down the till records, signs and chains locally and uploads later.
      SYNC_BASE_URL: http://sync-service:8082
      CORE_BASE_URL: http://core-service:8083
      # Only the simulated M-Pesa flow exists; anything else is refused by the route.
      MPESA_MODE: ${MARA_MPESA_MODE:-mock}
    ports:
      - "${MARA_TERMINAL_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The owners' back office: sales, tills, staff, exceptions. A browser app whose server side holds the credential in an
  # encrypted cookie and may call only the fixed list of operations in apps/office/src/lib/routes.ts.
  office:
    build:
      context: ./apps/office
    depends_on:
      identity-service:
        condition: service_healthy
    environment:
      IDENTITY_BASE_URL: http://identity-service:8081
      SYNC_BASE_URL: http://sync-service:8082
      CORE_BASE_URL: http://core-service:8083
      OFFICE_SESSION_SECRET: ${OFFICE_SESSION_SECRET:?set in .env (32+ random characters, e.g. openssl rand -hex 32)}
      # true behind HTTPS; false only for http://localhost
      OFFICE_COOKIE_SECURE: ${OFFICE_COOKIE_SECURE:-false}
    ports:
      - "${MARA_OFFICE_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mara-postgres-data:
