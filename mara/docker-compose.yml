# Brings up identity-service and the Postgres it owns from nothing — a genuinely
# fresh volume, no manual role/password step. See services/identity-service/README
# for the two-role model this depends on, and AppRoleLoginBootstrap for how
# mara_app gets a login without a credential ever living in a migration.
#
#   cp services/identity-service/.env.example services/identity-service/.env
#   # fill in MARA_DB_OWNER_PASSWORD and MARA_DB_APP_PASSWORD
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mara_identity
      POSTGRES_USER: mara_owner
      POSTGRES_PASSWORD: ${MARA_DB_OWNER_PASSWORD:?set in services/identity-service/.env}
    volumes:
      - mara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mara_owner -d mara_identity"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432" # non-default host port: avoids colliding with another local Postgres

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MARA_DB_URL: jdbc:postgresql://postgres:5432/mara_identity
      MARA_DB_OWNER_USER: mara_owner
      MARA_DB_OWNER_PASSWORD: ${MARA_DB_OWNER_PASSWORD:?set in services/identity-service/.env}
      MARA_DB_APP_USER: mara_app
      MARA_DB_APP_PASSWORD: ${MARA_DB_APP_PASSWORD:?set in services/identity-service/.env}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mara-postgres-data:
