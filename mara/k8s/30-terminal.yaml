apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: mara
  labels: {app.kubernetes.io/name: terminal, app.kubernetes.io/part-of: mara}
spec:
  selector: {app.kubernetes.io/name: terminal}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  namespace: mara
  labels: {app.kubernetes.io/name: terminal, app.kubernetes.io/part-of: mara}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: terminal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: terminal, app.kubernetes.io/part-of: mara}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: terminal}
      containers:
        - name: terminal
          image: mara-terminal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3100}
          env:
            - name: IDENTITY_BASE_URL
              valueFrom: {configMapKeyRef: {name: mara-config, key: MARA_IDENTITY_URL}}
            - name: SYNC_BASE_URL
              valueFrom: {configMapKeyRef: {name: mara-config, key: MARA_SYNC_URL}}
            - name: CORE_BASE_URL
              valueFrom: {configMapKeyRef: {name: mara-config, key: MARA_CORE_URL}}
            - name: MPESA_MODE
              valueFrom: {configMapKeyRef: {name: mara-config, key: MARA_MPESA_MODE}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 384Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terminal
  namespace: mara
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: terminal}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    # A JVM service takes about a minute to start, so scale up promptly and down slowly.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terminal
  namespace: mara
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: terminal}
