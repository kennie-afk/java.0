;; Connection pooler in front of Postgres.
;;
;; Why it exists: 27 services, each with its own Hikari pool, multiplied by
;; replicas, opens far more Postgres connections than the server will accept.
;; Postgres costs several megabytes and a process per connection; PgBouncer
;; costs a few kilobytes and hands out a small set of real connections.
;;
;; Transaction pooling: a server connection is held only for the length of a
;; transaction, so hundreds of idle application connections share a handful of
;; real ones. It is what makes the ratio work, and it is why
;; `prepareThreshold=0` appears in the JDBC URLs - see the note below.

[databases]
;; Every service has its own database and they all live on the same server, so
;; one wildcard entry routes them all. The pool is still kept per database.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; SCRAM both ways. Postgres 14+ stores SCRAM verifiers, so md5 here fails with
;; "wrong password type". The userlist holds the plaintext password, which lets
;; PgBouncer answer a SCRAM challenge from a client and raise one against the
;; server. The file is written at start-up from the environment, mode 600, and
;; is never part of an image or the repository.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction mode is the only mode that gives a useful connection ratio.
;; Session mode would pin a server connection for the life of every Hikari
;; connection, which is the problem we are solving.
pool_mode = transaction

;; What the application side may open. Generous: these are cheap.
max_client_conn = 2000

;; What actually reaches Postgres, per database. 27 databases x 15 = 405 worst
;; case, but only for databases under load at the same moment; Postgres is set
;; to 200 and reserve_pool absorbs bursts. Raise together, never separately.
default_pool_size = 15
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Recycle server connections so a long-lived pool cannot pin a backend that
;; has accumulated memory or a stale plan.
server_lifetime = 3600
server_idle_timeout = 600

;; Prepared statements: the JDBC URLs set prepareThreshold=0, so the driver
;; never creates server-side prepares. That is the safe pairing with transaction
;; pooling - a prepare made on one server connection is invisible on the next.
;; PgBouncer 1.21+ can track them instead (max_prepared_statements), which keeps
;; the plan-cache benefit; worth measuring before adopting, not assuming.

;; Spring sends this at startup and PgBouncer refuses unknown parameters.
ignore_startup_parameters = extra_float_digits,search_path

log_connections = 0
log_disconnections = 0
stats_period = 60
