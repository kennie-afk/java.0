spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
          predicates:
            - Path=/api/identity/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityService
                fallbackUri: forward:/fallback/identity
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@authenticatedUserKeyResolver}"
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
        - id: farm-service
          uri: ${FARM_SERVICE_URI:http://farm-service:8082}
          predicates:
            - Path=/api/farm/**
          filters:
            - name: CircuitBreaker
