resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

smartseason:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:smartseason-identity}

logging:
  level:
    root: INFO
    com.smartseason: ${LOG_LEVEL:INFO}
