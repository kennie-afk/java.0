spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          # One short call per request, so a small pool is plenty. 27 services
          # times a large pool is a lot of sockets and client-side buffers for
          # no gain.
          max-active: 4
          max-idle: 2
          min-idle: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.smartseason.*"

server:
  port: 8099
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      service: payment-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

smartseason:
  jwt:
    secret: ${JWT_SECRET:smartseason-dev-signing-key-change-me-in-production-min-64-chars-long}
    issuer: ${JWT_ISSUER:smartseason-identity}
  events:
    enabled: ${EVENTS_ENABLED:false}
    topic-prefix: ss
  cache:
    # Row counts behind list endpoints. Stale by at most this long between a
    # write on another replica and its eviction here.
    enabled: ${CACHE_ENABLED:true}
    count-ttl-seconds: ${CACHE_COUNT_TTL:30}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    read-capacity: ${RATE_LIMIT_READ_CAPACITY:300}
    read-refill-per-second: ${RATE_LIMIT_READ_REFILL:5}
    write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:60}
    write-refill-per-second: ${RATE_LIMIT_WRITE_REFILL:1}
    anonymous-capacity: ${RATE_LIMIT_ANON_CAPACITY:30}
    anonymous-refill-per-second: ${RATE_LIMIT_ANON_REFILL:0.5}

logging:
  level:
    root: INFO
    com.smartseason: ${LOG_LEVEL:INFO}
