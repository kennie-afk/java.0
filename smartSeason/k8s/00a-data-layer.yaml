---
# Generated by tools/gen_k8s.py - edit tools/tpl_data.py, not this file.
#
# The data tier: Postgres behind PgBouncer, Redis, and Redpanda speaking the Kafka
# protocol. Apply this before the service manifests; they have no retry budget for a
# database that does not exist yet, and 29 deployments crash-looping is a slow way to
# discover an ordering mistake.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: smartseason
data:
  # One database per service, generated from the catalogue. Deriving these names by
  # string surgery on the service name is what put `device-registry_db` and
  # `telemetry-ingest_db` into the manifests while the databases were really called
  # `device_db` and `telemetry_db`.
  init-databases.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -v app_user="$APP_DB_USER" -v app_pw="$APP_DB_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION', :'app_user', :'app_pw')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE identity_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE farm_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE season_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE agronomy_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE weather_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE device_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE telemetry_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE automation_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE workforce_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE attendance_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE task_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE fraud_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE catalog_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE pricing_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE order_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE inventory_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE logistics_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE payment_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE ledger_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE payout_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE traceability_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE notification_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE media_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE search_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE analytics_db;"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE audit_db;"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: smartseason
  labels:
    app: postgres
spec:
  # Headless. There is one database pod and nothing should load-balance across
  # database replicas as though they were interchangeable.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smartseason
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # The alpine image runs as uid 70; the mounted volume must be group-writable
        # by it or initdb fails on a permission error that reads like corruption.
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          # PgBouncer is allowed to ask for more connections than this in the worst
          # case - see the pool arithmetic below - so this is the backstop that turns
          # over-subscription into a refused connection rather than an exhausted
          # server. Raise it and default_pool_size together, never separately.
          args: ["postgres", "-c", "max_connections=400"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smartseason-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: DB_PASSWORD
            # The unprivileged role the services run as; row-level security applies to it.
            - name: APP_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smartseason-config
                  key: APP_DB_USERNAME
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: APP_DB_PASSWORD
            # A mounted volume always contains lost+found, and Postgres refuses to
            # initialise into a directory that is not empty. Putting the cluster in a
            # subdirectory is the standard way round it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: smartseason
data:
  # Read verbatim from infra/docker/pgbouncer/ at generation time. `host=postgres`
  # already resolves in this namespace, so the file needs no cluster-specific edit -
  # which is the point of not keeping a second copy.
  pgbouncer.ini: |
    ;; Connection pooler in front of Postgres.
    ;;
    ;; Why it exists: 27 services, each with its own Hikari pool, multiplied by
    ;; replicas, opens far more Postgres connections than the server will accept.
    ;; Postgres costs several megabytes and a process per connection; PgBouncer
    ;; costs a few kilobytes and hands out a small set of real connections.
    ;;
    ;; Transaction pooling: a server connection is held only for the length of a
    ;; transaction, so hundreds of idle application connections share a handful of
    ;; real ones. It is what makes the ratio work, and it is why
    ;; `prepareThreshold=0` appears in the JDBC URLs - see the note below.

    [databases]
    ;; Every service has its own database and they all live on the same server, so
    ;; one wildcard entry routes them all. The pool is still kept per database.
    * = host=postgres port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432

    ;; SCRAM both ways. Postgres 14+ stores SCRAM verifiers, so md5 here fails with
    ;; "wrong password type". The userlist holds the plaintext password, which lets
    ;; PgBouncer answer a SCRAM challenge from a client and raise one against the
    ;; server. The file is written at start-up from the environment, mode 600, and
    ;; is never part of an image or the repository.
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    ;; Transaction mode is the only mode that gives a useful connection ratio.
    ;; Session mode would pin a server connection for the life of every Hikari
    ;; connection, which is the problem we are solving.
    pool_mode = transaction

    ;; What the application side may open. Generous: these are cheap.
    max_client_conn = 2000

    ;; What actually reaches Postgres, per database. 27 databases x 15 = 405 worst
    ;; case, but only for databases under load at the same moment; Postgres is set
    ;; to 200 and reserve_pool absorbs bursts. Raise together, never separately.
    default_pool_size = 15
    min_pool_size = 2
    reserve_pool_size = 5
    reserve_pool_timeout = 3

    ;; Recycle server connections so a long-lived pool cannot pin a backend that
    ;; has accumulated memory or a stale plan.
    server_lifetime = 3600
    server_idle_timeout = 600

    ;; Prepared statements: the JDBC URLs set prepareThreshold=0, so the driver
    ;; never creates server-side prepares. That is the safe pairing with transaction
    ;; pooling - a prepare made on one server connection is invisible on the next.
    ;; PgBouncer 1.21+ can track them instead (max_prepared_statements), which keeps
    ;; the plan-cache benefit; worth measuring before adopting, not assuming.

    ;; Spring sends this at startup and PgBouncer refuses unknown parameters.
    ignore_startup_parameters = extra_float_digits,search_path

    log_connections = 0
    log_disconnections = 0
    stats_period = 60
  entrypoint.sh: |
    #!/bin/sh
    # Builds the password file from the environment so no credential is baked into
    # an image or committed to the repository.
    #
    # The password is stored in plain text on purpose: PgBouncer needs it to answer
    # a SCRAM challenge from a client *and* to raise one against Postgres. A stored
    # verifier would only work in one direction. The file is mode 600 inside a
    # container that holds nothing else.
    set -eu

    : "${POSTGRES_USER:?POSTGRES_USER must be set}"
    : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    : "${APP_DB_USER:=smartseason_app}"
    : "${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}"

    # Two logins pass through the pooler: the owner (Flyway) and the unprivileged application role.
    printf '"%s" "%s"\n"%s" "%s"\n' "$POSTGRES_USER" "$POSTGRES_PASSWORD" \
        "$APP_DB_USER" "$APP_DB_PASSWORD" > /etc/pgbouncer/userlist.txt
    chmod 600 /etc/pgbouncer/userlist.txt

    exec pgbouncer /etc/pgbouncer/pgbouncer.ini
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: smartseason
  labels:
    app: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: smartseason
  labels:
    app: pgbouncer
  annotations:
    # check-k8s-scaling.py requires an autoscaler on every Deployment. A connection
    # pooler is the one place that rule is wrong: scaling it on CPU multiplies the
    # server-side connections it opens, so the response to load would be to consume
    # more of the resource that is already scarce. Pinned instead, with the pool
    # arithmetic below sized for exactly this replica count.
    smartseason.io/no-hpa: >-
      A pooler must not autoscale: each replica opens its own server-side pools, so
      scaling out consumes the Postgres connection budget rather than relieving it.
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p2
          # The ConfigMap mount is read-only and the entrypoint writes userlist.txt
          # next to the ini, so /etc/pgbouncer is a writable emptyDir and the config
          # is copied in. The upstream entrypoint then runs unchanged.
          command: ["sh", "-c", "cp /config/pgbouncer.ini /etc/pgbouncer/ && exec sh /config/entrypoint.sh"]
          ports:
            - name: pgbouncer
              containerPort: 6432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smartseason-config
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: DB_PASSWORD
            # The unprivileged role the services run as; row-level security applies to it.
            - name: APP_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smartseason-config
                  key: APP_DB_USERNAME
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: APP_DB_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
            - name: runtime
              mountPath: /etc/pgbouncer
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
            defaultMode: 0755
        - name: runtime
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: smartseason
spec:
  # One of two, so a node drain can never take both and leave 27 services without a
  # route to the database. Below the replica count, or the drain blocks for ever.
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
---
apiVersion: v1
kind: Service
metadata:
  name: objectstore
  namespace: smartseason
  labels:
    app: objectstore
spec:
  clusterIP: None
  selector:
    app: objectstore
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectstore
  namespace: smartseason
spec:
  serviceName: objectstore
  replicas: 1
  selector:
    matchLabels:
      app: objectstore
  template:
    metadata:
      labels:
        app: objectstore
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          # minio/minio is no longer published; bitnamilegacy/minio is the same 2024-10-13
          # server build. Its stock entrypoint serves /bitnami/minio/data on 9000/9001.
          image: bitnamilegacy/minio:2024.10.13
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartseason-secrets
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartseason
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: smartseason
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          # Rate-limit buckets and cached row counts both survive a restart with
          # appendonly on. Neither is authoritative - the limiter fails open and the
          # count falls back to the database - so this is a convenience, not a
          # durability guarantee.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  # Named `kafka` because that is what KAFKA_BOOTSTRAP_SERVERS already says and what
  # 27 services are configured to reach. Redpanda speaks the Kafka protocol; the name
  # describes the contract, not the implementation.
  name: kafka
  namespace: smartseason
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: smartseason
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.8
          args:
            - redpanda
            - start
            - --smp=1
            - --overprovisioned
            - --node-id=0
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            # Must be the Service name: this is the address brokers hand back to
            # clients after the bootstrap call, so a wrong value here produces a
            # connection that succeeds and then times out on the first produce.
            - --advertise-kafka-addr=PLAINTEXT://kafka.smartseason.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
