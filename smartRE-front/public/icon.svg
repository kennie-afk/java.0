<!--
  Favicon.

  Not the full mark. At 16px the circuit traces collapse into three grey smudges, the
  specular highlight becomes noise, and the drop shadow just blurs the silhouette — so
  this keeps the two things that still carry identity at that size: the open ring and the
  SR monogram, both flattened to a single gold. Anything more detailed reads as a dirty
  square in a tab strip.

  The geometry is lifted unchanged from logo-icon.svg so the two are recognisably the
  same mark, only scaled and simplified.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>SmartRE</title>
  <path d="M 96 372 A 196 196 0 1 1 404 372"
        fill="none" stroke="#C9A227" stroke-width="30" stroke-linecap="round"/>
  <g transform="translate(268 262) scale(0.92) translate(-287 -240)">
    <path d="M 268 168 L 164 168 L 164 240 L 258 240 L 258 312 L 154 312"
          fill="none" stroke="#C9A227" stroke-width="38"
          stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M 296 151 H 392 L 416 175 V 217 L 394 239 L 420 329 H 380 L 357 245 H 330 V 329 H 296 Z
             M 330 185 H 382 V 211 H 330 Z"
          fill="#C9A227" fill-rule="evenodd"/>
  </g>
</svg>
