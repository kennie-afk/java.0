<!--
  SmartRE mark.

  Built on the TechMara construction, because SmartRE is a TechMara product and should
  read as one from across a room: a broken ring, an angular monogram set inside it, and
  circuit traces entering from the left. What changes is the palette — TechMara's teal
  and orange become SmartRE's gold, the only accent colour the product itself uses.

  This is the flat variant, kept for anywhere the full treatment is wrong: a one-colour
  print run, an embroidery file, a favicon at a size where a specular highlight is just
  noise. logo-icon.svg is the one to reach for otherwise — same geometry, with the
  metallic ramp, specular pass and contact shadow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="SmartRE">
  <title>SmartRE</title>

  <defs>
    <!-- Top-left light to bottom-right dark: one consistent light source across the
         whole mark, which is what makes the flat shapes read as bevelled. -->
    <linearGradient id="sre-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6D08F"/>
      <stop offset="45%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6B1A"/>
    </linearGradient>

    <linearGradient id="sre-gold-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#D9BC66"/>
      <stop offset="60%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6B1A"/>
    </linearGradient>

  </defs>

  <!-- Ring: one long arc carrying most of the circle, with a thin outer arc on the
       left for the same layered feel as the parent mark.

       There was a second, heavier arc across the top right. It is gone: its endpoints
       sat at different radii from the centre, so the renderer scaled the radius to span
       the chord and chose the sweep that bulged inward, drawing a stroke down through
       the R. Removing it is the better fix — the mark reads cleaner without a decorative
       stroke competing with the monogram. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 96 372 A 196 196 0 1 1 404 372"
          stroke="url(#sre-gold-arc)" stroke-width="20"/>
    <path d="M 62 330 A 214 214 0 0 1 62 182"
          stroke="#D9BC66" stroke-width="7" opacity="0.85"/>
  </g>

  <!-- Circuit traces. Three lines fanning in from the left, each starting at an open
       node — the same device the parent mark uses to say "this is engineering", placed
       on the same side so the two logos sit together without competing. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <g stroke="#AD8620">
      <path d="M 46 206 H 84 L 106 228 H 150"/>
      <path d="M 46 306 H 84 L 106 284 H 150"/>
    </g>
    <path d="M 46 256 H 150" stroke="#C9A227"/>
    <g fill="#FFFFFF" stroke="#AD8620" stroke-width="6">
      <circle cx="32" cy="206" r="10"/>
      <circle cx="32" cy="306" r="10"/>
    </g>
    <circle cx="32" cy="256" r="10" fill="#FFFFFF" stroke="#C9A227" stroke-width="6"/>
  </g>

  <!-- Monogram. Each letter is drawn twice: a darker copy offset down and right for the
       extruded edge, then the gradient face on top. That is what gives the parent mark
       its weight, and it survives being scaled down to a favicon far better than real
       faceting would. -->
  <g transform="translate(0 6)">
    <!-- S: an angular stroke rather than a curve, to match the flat planes of the R. -->
    <path d="M 268 168 L 164 168 L 164 240 L 258 240 L 258 312 L 154 312"
          fill="none" stroke="#6B5114" stroke-width="34"
          stroke-linecap="butt" stroke-linejoin="miter" transform="translate(7 7)"/>
    <path d="M 268 168 L 164 168 L 164 240 L 258 240 L 258 312 L 154 312"
          fill="none" stroke="url(#sre-gold)" stroke-width="34"
          stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- R: chamfered bowl and a straight leg, so every corner in the monogram is a
         mitre and none is a curve. -->
    <path d="M 296 151 H 392 L 416 175 V 217 L 394 239 L 420 329 H 380 L 357 245 H 330 V 329 H 296 Z
             M 330 185 H 382 V 211 H 330 Z"
          fill="#6B5114" fill-rule="evenodd" transform="translate(7 7)"/>
    <path d="M 296 151 H 392 L 416 175 V 217 L 394 239 L 420 329 H 380 L 357 245 H 330 V 329 H 296 Z
             M 330 185 H 382 V 211 H 330 Z"
          fill="url(#sre-gold)" fill-rule="evenodd"/>
  </g>
</svg>
