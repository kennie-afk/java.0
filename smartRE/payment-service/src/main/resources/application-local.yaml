spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.kenyarealestate.*"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.kenyarealestate: DEBUG

mpesa:
  callback-insecure-allow-all-ips: true
  consumer-key: ${MPESA_CONSUMER_KEY}
  consumer-secret: ${MPESA_CONSUMER_SECRET}
  shortcode: "174379"
  passkey: ${MPESA_PASSKEY}
  auth-url: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
  stk-push-url: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
  stk-query-url: https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query
  callback-url: ${MPESA_CALLBACK_URL:https://your-domain.com/api/payments/mpesa/callback}
  b2c-url: https://sandbox.safaricom.co.ke/mpesa/b2c/v3/paymentrequest
  b2c-callback-url: ${MPESA_B2C_CALLBACK_URL:https://your-domain.com/api/revenue/mpesa/b2c/callback}
  b2c-status-query-url: https://sandbox.safaricom.co.ke/mpesa/transactionstatus/v1/query
  b2c-status-callback-url: ${MPESA_B2C_STATUS_CALLBACK_URL:https://your-domain.com/api/revenue/mpesa/b2c/status-callback}
  initiator-name: testapi
  initiator-credential: ${MPESA_INITIATOR_CREDENTIAL}
  security-credential-cert-path: ${MPESA_SECURITY_CREDENTIAL_CERT_PATH:file:/nonexistent-configure-mpesa-cert}

platform:
  viewing-fee-kes: 200
  transaction-commission-pct: 2.5

redis:
  payment-lock-prefix: "payment:lock:"
  payment-lock-ttl-seconds: 30