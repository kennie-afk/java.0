  pms-db-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  user-db-data:
  verification-db-data:
  property-db-data:
  viewing-db-data:
  payment-db-data:
  review-db-data: