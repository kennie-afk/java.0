      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-placeholder}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-placeholder}
      MPESA_AUTH_URL: ${MPESA_AUTH_URL:-https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
      MPESA_STK_PUSH_URL: ${MPESA_STK_PUSH_URL:-https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
      MPESA_STK_QUERY_URL: ${MPESA_STK_QUERY_URL:-https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://your-domain.com/api/payments/mpesa/callback}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?MPESA_CALLBACK_SECRET must be set in .env}
      MPESA_CALLBACK_ALLOWED_IPS: ${MPESA_CALLBACK_ALLOWED_IPS:-}
      MPESA_CALLBACK_INSECURE_ALLOW_ALL_IPS: ${MPESA_CALLBACK_INSECURE_ALLOW_ALL_IPS:-false}
      MPESA_C2B_SHORTCODE: ${MPESA_C2B_SHORTCODE:-}
      MPESA_C2B_VALIDATION_URL: ${MPESA_C2B_VALIDATION_URL:-https://your-domain.com/api/payments/mpesa/c2b/validation}
      MPESA_C2B_CONFIRMATION_URL: ${MPESA_C2B_CONFIRMATION_URL:-https://your-domain.com/api/payments/mpesa/c2b/confirmation}
      MPESA_B2C_URL: ${MPESA_B2C_URL:-https://sandbox.safaricom.co.ke/mpesa/b2c/v3/paymentrequest}
      MPESA_B2C_CALLBACK_URL: ${MPESA_B2C_CALLBACK_URL:-https://your-domain.com/api/revenue/mpesa/b2c/callback}
      MPESA_INITIATOR_NAME: ${MPESA_INITIATOR_NAME:-testapi}
      MPESA_INITIATOR_CREDENTIAL: ${MPESA_INITIATOR_CREDENTIAL:-placeholder}
      MPESA_SECURITY_CREDENTIAL_CERT_PATH: ${MPESA_SECURITY_CREDENTIAL_CERT_PATH:-file:/nonexistent-configure-mpesa-cert}
      PLATFORM_VIEWING_FEE_KES: ${PLATFORM_VIEWING_FEE_KES:-200}
      PLATFORM_COMMISSION_PCT: ${PLATFORM_COMMISSION_PCT:-2.5}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in .env}
      PMS_SERVICE_URL: http://property-management-service:8088
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./payment-service/certs:/certs:ro
    depends_on:
      payment-pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  review-service:
    mem_limit: 640m
    mem_reservation: 128m
    build: ./review-service
    restart: on-failure
    logging: *default-logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-pgbouncer:5432/review_db?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      PAYMENT_SERVICE_URL: http://payment-service:8085
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      review-pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  notification-service:
    mem_limit: 640m
    mem_reservation: 128m
    build: ./notification-service
    restart: on-failure
    logging: *default-logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-pgbouncer:5432/notification_db?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      USER_SERVICE_URL: http://user-service:8081
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@smartre.co.ke}
      SMS_USERNAME: ${SMS_USERNAME:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
    depends_on:
      notification-pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  property-management-service:
    mem_limit: 768m
    mem_reservation: 128m
    build: ./property-management-service
    restart: on-failure
    logging: *default-logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pms-pgbouncer:5432/pms_db?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set in .env}
      PROPERTY_SERVICE_URL: http://property-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      USER_SERVICE_URL: http://user-service:8081
      PMS_MANAGEMENT_FEE_PCT: ${PMS_MANAGEMENT_FEE_PCT:-10.0}
      PMS_INVOICE_CRON: ${PMS_INVOICE_CRON:-0 0 2 * * *}
      PMS_ARREARS_CRON: ${PMS_ARREARS_CRON:-0 30 2 * * *}
      PMS_INVOICE_GRACE_DAYS: ${PMS_INVOICE_GRACE_DAYS:-5}
      PMS_INVOICE_LEAD_DAYS: ${PMS_INVOICE_LEAD_DAYS:-7}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      pms-pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      property-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  web:
    build:
      context: ../smartRE-front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${S3_PUBLIC_BASE_URL:-https://smartre-documents.s3.amazonaws.com}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: on-failure
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Server-side fetches (the image optimiser) cannot use the public URL:
      # inside the container that is its own loopback.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api-gateway:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    mem_limit: 512m
    mem_reservation: 128m
    build: ./api-gateway
    restart: on-failure
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:?GATEWAY_SIGNING_SECRET must be set in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
      viewing-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      property-management-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

