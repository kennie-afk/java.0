spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://notification-db:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholder-replacement: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  thymeleaf:
    check-template-location: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8087

jwt:
  secret: ${JWT_SECRET}

mail:
  from: ${MAIL_FROM:no-reply@smartre.co.ke}
  from-name: ${MAIL_FROM_NAME:SmartRE Kenya}

notification:
  max-attempts: 5
  send-rate-per-minute: ${NOTIFICATION_SEND_RATE:120}
  retry:
    fixed-delay-ms: 60000
    initial-delay-ms: 30000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

services:
  user-url: ${USER_SERVICE_URL:http://user-service:8081}
  internal-secret: ${INTERNAL_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.RestClientException

kafka:
  topics:
    payment-events: payment-events
    verification-events: verification-events
    viewing-events: viewing-events
    property-events: property-events
    pms-events: pms-events

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gateway:
  signing-secret: ${GATEWAY_SIGNING_SECRET}

# Outbound SMS (Africa's Talking). Without an api-key the channel logs what it would have
# sent rather than failing, so the notification preferences screen can offer the toggle
# honestly and delivery starts the moment credentials arrive.
sms:
  username:  ${SMS_USERNAME:}
  api-key:   ${SMS_API_KEY:}
  sender-id: ${SMS_SENDER_ID:}
  endpoint:  ${SMS_ENDPOINT:https://api.africastalking.com/version1/messaging}
