# kubectl apply -k k8s/
# The Secret is deliberately not listed: it is generated by scripts/k8s-secret.sh and applied first.
# secret.example.yaml documents its keys and must never be applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - 00a-data-layer.yaml
  - 00b-messaging.yaml
  - api-gateway.yaml
  - user-service.yaml
  - verification-service.yaml
  - property-service.yaml
  - viewing-service.yaml
  - payment-service.yaml
  - review-service.yaml
  - notification-service.yaml
  - property-management-service.yaml
  - web.yaml
  - cert-issuer.yaml
  - ingress.yaml
  - network-policy.yaml
