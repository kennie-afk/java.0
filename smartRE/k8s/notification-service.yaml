apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smartre
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8087"
    spec:
      containers:
        - name: notification-service
          image: smartre/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pgbouncer-notification_db:5432/notification_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: JWT_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: REDIS_HOST
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: GATEWAY_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: GATEWAY_SIGNING_SECRET
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: MAIL_HOST
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: MAIL_PASSWORD

            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: INTERNAL_SECRET
            - name: SMS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: SMS_USERNAME
            - name: SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: SMS_API_KEY
            - name: SMS_SENDER_ID
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: SMS_SENDER_ID
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: FRONTEND_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "640Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smartre
spec:
  selector:
    app: notification-service
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: smartre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
