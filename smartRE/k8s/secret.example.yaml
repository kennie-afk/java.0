# EXAMPLE ONLY. Nothing in this file is a real value, and it is not what you apply.
# Generate the real Secret instead (random values for everything the platform owns, your own
# provider credentials from the environment) and pipe it straight to the cluster:
#
#   ./scripts/k8s-secret.sh | kubectl apply -f -
#
# scripts/check-k8s-env.py compares this file's keys with the generator's and with every
# secretKeyRef in the manifests, so a key added in one place and not the others fails CI.
apiVersion: v1
kind: Secret
metadata:
  name: smartre-secrets
  namespace: smartre
type: Opaque
stringData:
  JWT_SECRET: "placeholder"
  DB_PASSWORD: "placeholder"
  INTERNAL_SECRET: "placeholder"
  MPESA_CONSUMER_KEY: "placeholder"
  MPESA_CONSUMER_SECRET: "placeholder"
  MPESA_PASSKEY: "placeholder"
  # Shared with Safaricom so an inbound callback can be proved genuine
  # rather than taken on trust from whoever posted to the URL.
  MPESA_CALLBACK_SECRET: "placeholder"
  MPESA_CALLBACK_URL: "https://your-domain.com/api/payments/mpesa/callback"
  # Signs the header the gateway attaches to every proxied request, so a service can
  # tell "this came through the gateway" from "someone reached my pod directly".
  GATEWAY_SIGNING_SECRET: "placeholder"
  # SMTP credentials for notification-service. Leave blank only if you have also
  # disabled outbound mail — an empty username silently sends nothing.
  MAIL_USERNAME: "placeholder"
  MAIL_PASSWORD: "placeholder"
  # Africa's Talking. Blank means SMS is logged rather than sent, which is a
  # supported state — the notification preferences screen offers the toggle either way.
  SMS_USERNAME: "placeholder"
  SMS_API_KEY: "placeholder"
  # Only read when SMILE_IDENTITY_ENABLED / ARDHISASA_ENABLED are true. With
  # SMARTRE_ENVIRONMENT=production an enabled provider must have real values.
  SMILE_IDENTITY_PARTNER_ID: "placeholder"
  SMILE_IDENTITY_API_KEY: "placeholder"
  ARDHISASA_API_KEY: "placeholder"
  # Only read when DOCUMENT_ANALYSIS_ENABLED is true.
  GEMINI_API_KEY: "placeholder"
  # Only read when S3_ENABLED is true.
  S3_ACCESS_KEY: "placeholder"
  S3_SECRET_KEY: "placeholder"

