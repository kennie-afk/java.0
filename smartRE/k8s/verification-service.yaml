apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: smartre
  labels:
    app: verification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: verification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: verification-service
          image: smartre/verification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pgbouncer-verification-db:5432/verification_db?prepareThreshold=0
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: JWT_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: REDIS_HOST
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: PROPERTY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: PROPERTY_SERVICE_URL
            - name: SMILE_IDENTITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: SMILE_IDENTITY_ENABLED
            - name: ARDHISASA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: ARDHISASA_ENABLED
            # Production refuses to start with a provider unconfigured: see ProductionGuard.
            - name: SMARTRE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: SMARTRE_ENVIRONMENT
            - name: SMARTRE_ALLOW_UNCONFIGURED_PROVIDERS
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: SMARTRE_ALLOW_UNCONFIGURED_PROVIDERS
            - name: SMILE_IDENTITY_PARTNER_ID
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: SMILE_IDENTITY_PARTNER_ID
            - name: SMILE_IDENTITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: SMILE_IDENTITY_API_KEY
            - name: ARDHISASA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: ARDHISASA_API_KEY
            - name: GATEWAY_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: GATEWAY_SIGNING_SECRET
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: INTERNAL_SECRET
            # Turning this on without GEMINI_API_KEY set gives you an analysis path
            # that fails on every document, so the two move together.
            - name: DOCUMENT_ANALYSIS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: DOCUMENT_ANALYSIS_ENABLED
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: GEMINI_API_KEY
            - name: BIOMETRIC_HARD_BLOCK
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: BIOMETRIC_HARD_BLOCK
            - name: DOCUMENT_URL_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: DOCUMENT_URL_ALLOWED_HOSTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # Holds liveness/readiness off until the JVM has actually started. A fixed
          # initialDelaySeconds is a guess about startup time; under CPU pressure (first
          # deploy, a busy node) Spring takes longer than the guess and the liveness probe
          # kills the pod mid-boot, forever. Up to 10s x 40 = 400s to come up.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: smartre
spec:
  selector:
    app: verification-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verification-service-hpa
  namespace: smartre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verification-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
