        metadata: { labels: { app: pgbouncer-notification-db, tier: data } }
        spec:
          containers:
            - name: pgbouncer
              image: edoburu/pgbouncer:1.21.0-p1
              ports: [{ containerPort: 5432 }]
              env:
                - { name: DB_HOST, value: notification-db }
                - { name: DB_PORT, value: "5432" }
                - { name: DB_NAME, value: notification_db }
                - { name: DB_USER, value: postgres }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: smartre-secrets, key: DB_PASSWORD } }
                - { name: AUTH_TYPE, value: scram-sha-256 }
                - { name: POOL_MODE, value: transaction }
                - { name: MAX_CLIENT_CONN, value: "1000" }
                - { name: DEFAULT_POOL_SIZE, value: "20" }
                - { name: MIN_POOL_SIZE, value: "5" }
                - { name: RESERVE_POOL_SIZE, value: "5" }
                - { name: RESERVE_POOL_TIMEOUT, value: "3" }
              resources:
                requests: { memory: "64Mi", cpu: "50m" }
                limits: { memory: "128Mi", cpu: "200m" }
              readinessProbe:
                exec: { command: ["pg_isready", "-h", "localhost", "-p", "5432"] }
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                exec: { command: ["pg_isready", "-h", "localhost", "-p", "5432"] }
                initialDelaySeconds: 10
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata: { name: pgbouncer-notification-db, namespace: smartre }
    spec:
      selector: { app: pgbouncer-notification-db }
      ports: [{ port: 5432, targetPort: 5432 }]

  # ---------------------------------------------------------------------------
  # pms_db (property-management-service)
  # ---------------------------------------------------------------------------
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: pms-db
      namespace: smartre
      labels: { app: pms-db }
    spec:
      serviceName: pms-db
      replicas: 1
      selector: { matchLabels: { app: pms-db } }
      template:
        metadata: { labels: { app: pms-db, tier: data-backend } }
        spec:
          containers:
            - name: postgres
              image: postgres:16-alpine
              ports: [{ containerPort: 5432 }]
              env:
                - { name: POSTGRES_DB, value: pms_db }
                - { name: POSTGRES_USER, value: postgres }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: smartre-secrets, key: DB_PASSWORD } }
              volumeMounts:
                - { name: data, mountPath: /var/lib/postgresql/data }
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              readinessProbe:
                exec: { command: ["pg_isready", "-U", "postgres"] }
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                exec: { command: ["pg_isready", "-U", "postgres"] }
                initialDelaySeconds: 15
                periodSeconds: 10
      volumeClaimTemplates:
        - metadata: { name: data }
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 5Gi } }
  - apiVersion: v1
    kind: Service
    metadata: { name: pms-db, namespace: smartre }
    spec:
      clusterIP: None
      selector: { app: pms-db }
      ports: [{ port: 5432, targetPort: 5432 }]
