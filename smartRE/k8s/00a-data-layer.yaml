# The data tier every service's SPRING_DATASOURCE_URL already points at, but which had no
# workload anywhere in k8s/ - `kubectl apply -f k8s/` would leave all eight services
# crash-looping on DNS resolution for pgbouncer-<name>-db, matching how SmartSeason's
# equivalent gap was closed (see k8s-data-layer-missing in that platform's history).
#
# Mirrors docker-compose.yml exactly: eight independent postgres:16-alpine instances, one
# per service database, each fronted by its own edoburu/pgbouncer in transaction-pool mode.
# Not a shared Postgres cluster - each service keeps the database-per-service isolation the
# rest of the platform relies on. Single replica each, same as compose; there is no HA or
# failover here, and that remains open (see k8s/README.md and the platform's open decisions).
#
# DB_PASSWORD comes from the smartre-secrets Secret already used by every app Deployment.

apiVersion: v1
kind: List
items:
  # ---------------------------------------------------------------------------
  # user_db
  # ---------------------------------------------------------------------------
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: user-db
      namespace: smartre
      labels: { app: user-db }
    spec:
      serviceName: user-db
      replicas: 1
      selector: { matchLabels: { app: user-db } }
      template:
        metadata: { labels: { app: user-db, tier: data-backend } }
        spec:
          containers:
            - name: postgres
              image: postgres:16-alpine
              ports: [{ containerPort: 5432 }]
              env:
                - { name: POSTGRES_DB, value: user_db }
                - { name: POSTGRES_USER, value: postgres }
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: smartre-secrets, key: DB_PASSWORD } }
              volumeMounts:
                - { name: data, mountPath: /var/lib/postgresql/data }
              resources:
                requests: { memory: "128Mi", cpu: "100m" }
                limits: { memory: "512Mi", cpu: "500m" }
              readinessProbe:
                exec: { command: ["pg_isready", "-U", "postgres"] }
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                exec: { command: ["pg_isready", "-U", "postgres"] }
                initialDelaySeconds: 15
                periodSeconds: 10
      volumeClaimTemplates:
        - metadata: { name: data }
          spec:
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 5Gi } }
  - apiVersion: v1
    kind: Service
    metadata: { name: user-db, namespace: smartre }
    spec:
      clusterIP: None
      selector: { app: user-db }
      ports: [{ port: 5432, targetPort: 5432 }]
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pgbouncer-user-db
      namespace: smartre
      labels: { app: pgbouncer-user-db }
    spec:
      replicas: 1
      selector: { matchLabels: { app: pgbouncer-user-db } }
      template:
        metadata: { labels: { app: pgbouncer-user-db, tier: data } }
        spec:
          containers:
            - name: pgbouncer
              image: edoburu/pgbouncer:1.21.0-p1
              ports: [{ containerPort: 5432 }]
              env:
                - { name: DB_HOST, value: user-db }
                - { name: DB_PORT, value: "5432" }
                - { name: DB_NAME, value: user_db }
                - { name: DB_USER, value: postgres }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: smartre-secrets, key: DB_PASSWORD } }
                - { name: AUTH_TYPE, value: scram-sha-256 }
                - { name: POOL_MODE, value: transaction }
                - { name: MAX_CLIENT_CONN, value: "1000" }
                - { name: DEFAULT_POOL_SIZE, value: "20" }
                - { name: MIN_POOL_SIZE, value: "5" }
                - { name: RESERVE_POOL_SIZE, value: "5" }
                - { name: RESERVE_POOL_TIMEOUT, value: "3" }
              resources:
                requests: { memory: "64Mi", cpu: "50m" }
                limits: { memory: "128Mi", cpu: "200m" }
              readinessProbe:
                exec: { command: ["pg_isready", "-h", "localhost", "-p", "5432"] }
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                exec: { command: ["pg_isready", "-h", "localhost", "-p", "5432"] }
                initialDelaySeconds: 10
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata: { name: pgbouncer-user-db, namespace: smartre }
    spec:
      selector: { app: pgbouncer-user-db }
      ports: [{ port: 5432, targetPort: 5432 }]

