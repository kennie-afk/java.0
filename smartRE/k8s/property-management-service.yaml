apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-management-service
  namespace: smartre
  labels:
    app: property-management-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-management-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: property-management-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8088"
    spec:
      containers:
        - name: property-management-service
          image: smartre/property-management-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pgbouncer-pms-db:5432/pms_db?prepareThreshold=0
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: JWT_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: REDIS_HOST
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: INTERNAL_SECRET
            - name: GATEWAY_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartre-secrets
                  key: GATEWAY_SIGNING_SECRET
            - name: PROPERTY_SERVICE_URL
              value: http://property-service:8083
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8085
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8087
            # The tenant invitation link points here. Its code default is a localhost URL,
            # which check-k8s-env.py rejects precisely because nothing errors when it is wrong
            # — the email simply arrives with a link nobody outside this pod can open.
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartre-config
                  key: FRONTEND_URL

          resources:
            requests:
              memory: "320Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          # Holds liveness/readiness off until the JVM has actually started. A fixed
          # initialDelaySeconds is a guess about startup time; under CPU pressure (first
          # deploy, a busy node) Spring takes longer than the guess and the liveness probe
          # kills the pod mid-boot, forever. Up to 10s x 40 = 400s to come up.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            periodSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: property-management-service
  namespace: smartre
spec:
  selector:
    app: property-management-service
  ports:
    - port: 8088
      targetPort: 8088
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: property-management-service-hpa
  namespace: smartre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: property-management-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
