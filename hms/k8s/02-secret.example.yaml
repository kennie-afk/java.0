# NOT applied by kustomize. Shows the keys the workloads read. Create the real Secret with scripts/k8s-secret.sh, which
# generates random values and never writes them to a file:  ./scripts/k8s-secret.sh | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: hms-secrets
  namespace: hms
type: Opaque
stringData:
  HMS_DB_OWNER_PASSWORD: CHANGE-ME
  HMS_DB_APP_PASSWORD: CHANGE-ME
  HMS_JWT_SECRET: CHANGE-ME-32-OR-MORE-RANDOM-CHARACTERS
  # Object store (the in-cluster MinIO root credentials, or the access key pair of an external S3 service).
  HMS_STORAGE_S3_ACCESS_KEY: CHANGE-ME
  HMS_STORAGE_S3_SECRET_KEY: CHANGE-ME-LONG-RANDOM
  # Optional, only for the live modes (docs/DEPLOY.md). Add them with kubectl create secret / edit; they are not generated:
  #   HMS_MPESA_CONSUMER_KEY, HMS_MPESA_CONSUMER_SECRET, HMS_MPESA_PASSKEY, HMS_MPESA_CALLBACK_SECRET (24+ random characters, goes in the callback URL)
  #   HMS_SMS_AT_USERNAME, HMS_SMS_AT_API_KEY, HMS_SMTP_PASSWORD
