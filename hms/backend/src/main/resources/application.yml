spring:
  application:
    name: hms
  datasource:
    # The API connects as the least-privilege application role (no ownership, no RLS bypass).
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_APP_USER:hms_app}
    password: ${HMS_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${HMS_DB_POOL_MAX:20}
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    # Migrations run as the schema OWNER, which creates the application role and the RLS policies.
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    user: ${HMS_DB_OWNER_USER:hms}
    password: ${HMS_DB_OWNER_PASSWORD}
    placeholders:
      appUser: ${HMS_DB_APP_USER:hms_app}
      appPassword: ${HMS_DB_APP_PASSWORD}
  servlet:
    multipart:
      # An image is at most 8 MB; the limits sit just above so the service, not the container, explains a refusal.
      max-file-size: 9MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8100}
  compression:
    enabled: true
  shutdown: graceful

hms:
  jwt:
    # No default: the service refuses to start without a signing secret of at least 32 characters.
    secret: ${HMS_JWT_SECRET}
    ttl-minutes: ${HMS_JWT_TTL_MINUTES:15}
    # A refresh token works once and slides: each use issues the next, for this long; the chain ends after refresh-family-max-days.
    refresh-ttl-hours: ${HMS_REFRESH_TTL_HOURS:168}
    refresh-family-max-days: ${HMS_REFRESH_FAMILY_MAX_DAYS:30}
    # Two parallel refreshes with the same token within this many seconds are not treated as theft (two browser tabs).
    refresh-grace-seconds: ${HMS_REFRESH_GRACE_SECONDS:10}
  cors:
    allowed-origins: ${HMS_ALLOWED_ORIGINS:http://localhost:3600}
  limits:
    # Lists returned whole because a catalogue bounds them (wards, beds, clinics, lab tests): past this the caller gets an error, not a slow answer.
    catalogue-cap: ${HMS_CATALOGUE_CAP:1000}
  roles:
    cache-ttl-ms: ${HMS_ROLE_CACHE_TTL_MS:15000}
  # "production" turns on start-up refusals for unsafe settings (the mock M-Pesa gateway; see ProductionGuard).
  environment: ${HMS_ENVIRONMENT:development}
  mpesa:
    # mock (default) simulates M-Pesa. daraja talks to Safaricom Daraja (STK push + callback); written from the public documentation,
    # NOT verified against Safaricom. The remaining keys are read only in daraja mode (HMS_MPESA_BASE_URL, _CONSUMER_KEY, _CONSUMER_SECRET,
    # _SHORTCODE, _PASSKEY, _CALLBACK_BASE_URL, _CALLBACK_SECRET): see docs/DEPLOY.md.
    mode: ${HMS_MPESA_MODE:mock}
    allow-mock-in-production: ${HMS_MPESA_ALLOW_MOCK_IN_PRODUCTION:false}
  storage:
    # local: files on this machine's disk (one node). s3: any S3-compatible store (HMS_STORAGE_S3_ENDPOINT, _BUCKET, _ACCESS_KEY, _SECRET_KEY,
    # optional _REGION, _CREATE_BUCKET, _PUBLIC_ENDPOINT), shared by every API pod.
    mode: ${HMS_STORAGE_MODE:local}
    local-path: ${HMS_STORAGE_PATH:./data/objects}
    # Off where the disk is not durable or shared (see k8s/01-config.yaml).
    uploads: ${HMS_STORAGE_UPLOADS:true}
  notifications:
    # mock (default) logs a masked line and sends nothing. live uses Africa's Talking for SMS and SMTP for e-mail, each only where configured
    # (a channel without settings fails loudly). Both are unverified against the live services.
    mode: ${HMS_NOTIFICATIONS_MODE:mock}
    sms:
      at-base-url: ${HMS_SMS_AT_BASE_URL:https://api.africastalking.com}
      at-username: ${HMS_SMS_AT_USERNAME:}
      at-api-key: ${HMS_SMS_AT_API_KEY:}
      sender-id: ${HMS_SMS_SENDER_ID:}
    smtp:
      host: ${HMS_SMTP_HOST:}
      port: ${HMS_SMTP_PORT:587}
      username: ${HMS_SMTP_USERNAME:}
      password: ${HMS_SMTP_PASSWORD:}
      from: ${HMS_SMTP_FROM:}
      starttls: ${HMS_SMTP_STARTTLS:true}
      ssl: ${HMS_SMTP_SSL:false}
    # The dispatcher polls the outbox; switch it off on replicas that should not deliver.
    dispatcher: ${HMS_NOTIFICATIONS_DISPATCHER:true}
    poll-ms: ${HMS_NOTIFICATIONS_POLL_MS:5000}
  security:
    # Only for local experiments. A superuser or BYPASSRLS role defeats tenant isolation.
    allow-privileged-db-role: ${HMS_ALLOW_PRIVILEGED_DB_ROLE:false}
    trust-forwarded-for: ${HMS_TRUST_FORWARDED_FOR:false}
    login-per-minute: ${HMS_RATELIMIT_LOGIN_PER_MINUTE:10}
    onboarding-per-hour: ${HMS_RATELIMIT_ONBOARDING_PER_HOUR:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
