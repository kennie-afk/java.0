name: mara

on:
  push:
    paths: ['mara/**', '.github/workflows/mara-ci.yml']
  pull_request:
    paths: ['mara/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn -B verify

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [terminal, office]
    defaults:
      run:
        working-directory: mara/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mara/apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
