name: smartseason

on:
  push:
    paths: ['smartSeason/**', '.github/workflows/smartseason-ci.yml']
  pull_request:
    paths: ['smartSeason/**']

jobs:
  # The structural guards are cheap and catch the mistakes that are expensive in production: an edited
  # migration, a role that gained a permission without the matrix, a manifest that drifted from the
  # generator. They run on every change, before the long build.
  guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartSeason
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-migrations-frozen.py
      - run: python3 scripts/check-rbac.py
      - run: python3 scripts/check-deploy.py
      - run: python3 scripts/check-k8s-data-layer.py
      - run: python3 scripts/check-k8s-scaling.py
      - run: python3 scripts/check-server-actions.py

  backend:
    needs: guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartSeason
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartSeason/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartSeason/apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
