name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['smartRE-front/**']
  pull_request:
    branches: [main]
    paths: ['smartRE-front/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartRE-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smartRE-front/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: smartRE-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smartRE-front/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: smartRE-front/playwright-report/
          retention-days: 14
