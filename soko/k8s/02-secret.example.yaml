# NOT applied by kustomize. Shows the keys the workloads read. Create the real Secret with scripts/k8s-secret.sh, which
# generates random values and never writes them to a file:  ./scripts/k8s-secret.sh | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: soko-secrets
  namespace: soko
type: Opaque
stringData:
  SOKO_DB_OWNER_PASSWORD: CHANGE-ME
  SOKO_DB_APP_PASSWORD: CHANGE-ME-16-OR-MORE-ALPHANUMERIC
  SOKO_SYSTEM_KEY: CHANGE-ME-16-OR-MORE-ALPHANUMERIC
  SOKO_JWT_SECRET: CHANGE-ME-32-OR-MORE-RANDOM-CHARACTERS
  # Live M-Pesa only; leave out for a demo deployment.
  # SOKO_MPESA_CONSUMER_KEY: ...
  # SOKO_MPESA_CONSUMER_SECRET: ...
  # SOKO_MPESA_PASSKEY: ...
  # SOKO_MPESA_CALLBACK_SECRET: 16-or-more-characters
