services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-soko}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soko}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-soko}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-soko}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SOKO_JWT_SECRET: ${SOKO_JWT_SECRET:?set a signing secret of at least 32 characters}
      SOKO_ALLOWED_ORIGINS: ${SOKO_ALLOWED_ORIGINS:-http://localhost:3500}
      DB_POOL_MAX: ${DB_POOL_MAX:-24}
      # Demo only: the mock M-Pesa customer approves the prompt by itself after this many seconds.
      SOKO_MPESA_MOCK_AUTOCOMPLETE_SECONDS: ${SOKO_MPESA_MOCK_AUTOCOMPLETE_SECONDS:-0}
      # M-Pesa. mock (default) never calls Safaricom and accepts any callback: demo only, never
      # facing real traffic. live needs every value below, and refuses to start without a
      # callback secret of at least 16 characters.
      SOKO_MPESA_MODE: ${SOKO_MPESA_MODE:-mock}
      SOKO_MPESA_BASE_URL: ${SOKO_MPESA_BASE_URL:-}
      SOKO_MPESA_CONSUMER_KEY: ${SOKO_MPESA_CONSUMER_KEY:-}
      SOKO_MPESA_CONSUMER_SECRET: ${SOKO_MPESA_CONSUMER_SECRET:-}
      SOKO_MPESA_SHORT_CODE: ${SOKO_MPESA_SHORT_CODE:-}
      SOKO_MPESA_PASSKEY: ${SOKO_MPESA_PASSKEY:-}
      SOKO_MPESA_CALLBACK_SECRET: ${SOKO_MPESA_CALLBACK_SECRET:-}
      SOKO_MPESA_CALLBACK_URL: ${SOKO_MPESA_CALLBACK_URL:-}
    ports:
      - "${API_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ./apps/console
    restart: unless-stopped
    environment:
      SOKO_API_URL: http://api:8090
      # Which tenant's catalogue the public /welcome page shows. Not required
      # to start the console -- without it, /welcome just skips the live
      # product grid rather than the whole app failing to boot. Set it to the
      # slug tools/seed_kamboucha.py prints after seeding (or `select slug
      # from tenants;`).
      STOREFRONT_TENANT_SLUG: ${STOREFRONT_TENANT_SLUG:-}
    ports:
      - "${CONSOLE_PORT:-3500}:3500"
    depends_on:
      - api

volumes:
  db_data:
