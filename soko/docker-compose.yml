services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-soko}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soko}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-soko}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-soko}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SOKO_JWT_SECRET: ${SOKO_JWT_SECRET:?set a signing secret of at least 32 characters}
      DB_POOL_MAX: ${DB_POOL_MAX:-24}
    ports:
      - "${API_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build:
      context: ./apps/console
    restart: unless-stopped
    environment:
      SOKO_API_URL: http://api:8090
    ports:
      - "${CONSOLE_PORT:-3500}:3500"
    depends_on:
      - api

volumes:
  db_data:
