spring:
  application:
    name: soko
  datasource:
    # The application runs as soko_app: it owns nothing, is not a superuser and cannot bypass
    # row-level security. The table owner (SPRING_DATASOURCE_USERNAME below) is used only by
    # Flyway, to migrate.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soko}
    username: ${SOKO_DB_APP_USER:soko_app}
    password: ${SOKO_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:24}
      minimum-idle: 4
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Migrations run as the table owner, not as the runtime role.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soko}
    user: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    placeholders:
      soko_app_password: ${SOKO_DB_APP_PASSWORD}
      soko_system_key: ${SOKO_SYSTEM_KEY}

server:
  port: ${PORT:8090}
  compression:
    enabled: true
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

soko:
  # Set SOKO_ENVIRONMENT=production on a real deployment: the process then refuses to start with mock
  # M-Pesa, a short JWT secret or the demo auto-answering customer (see ProductionGuard).
  environment: ${SOKO_ENVIRONMENT:development}
  rls:
    # Presented to the database to read across tenants (sign-in by e-mail, the M-Pesa callback,
    # the monthly billing run). The database stores only its hash.
    system-key: ${SOKO_SYSTEM_KEY}
    app-password: ${SOKO_DB_APP_PASSWORD}
  jwt:
    secret: ${SOKO_JWT_SECRET}
    ttl-minutes: ${SOKO_JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${SOKO_ALLOWED_ORIGINS:http://localhost:3500}
  # Public base URL of the console; password reset links point here.
  public-url: ${SOKO_PUBLIC_URL:http://localhost:3500}
  reset:
    ttl-minutes: ${SOKO_RESET_TTL_MINUTES:30}
  mail:
    # false = reset e-mails are only logged (development). true = sent over SMTP using Spring's
    # standard SPRING_MAIL_HOST / _PORT / _USERNAME / _PASSWORD settings.
    enabled: ${SOKO_MAIL_ENABLED:false}
    from: ${SOKO_MAIL_FROM:no-reply@freshferm.local}
  ratelimit:
    # Per client address, on the three unauthenticated endpoints. Per replica, in memory.
    login-per-minute: ${SOKO_RATELIMIT_LOGIN_PER_MINUTE:10}
    register-per-hour: ${SOKO_RATELIMIT_REGISTER_PER_HOUR:10}
    forgot-per-hour: ${SOKO_RATELIMIT_FORGOT_PER_HOUR:5}
    reset-per-hour: ${SOKO_RATELIMIT_RESET_PER_HOUR:20}
    # Behind a proxy that overwrites X-Forwarded-For only; otherwise a client can choose its address.
    trust-forwarded: ${SOKO_RATELIMIT_TRUST_FORWARDED:false}

management:
  health:
    # An unreachable SMTP relay must not take the readiness probe down.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
